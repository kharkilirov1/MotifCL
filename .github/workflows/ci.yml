name: ci

on:
  push:
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ocl-icd-opencl-dev pocl-opencl-icd

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip pytest build pybind11

      - name: Check OpenCL kernel contracts
        run: python tools/check_kernel_contracts.py

      - name: Configure release
        run: cmake --preset release

      - name: Build release
        run: cmake --build --preset release --parallel 2

      - name: Full CTest release
        run: |
          if ! ctest --test-dir build/release --output-on-failure --stop-on-failure; then
            failed_file="build/release/Testing/Temporary/LastTestsFailed.log"
            log_file="build/release/Testing/Temporary/LastTest.log"
            failed_tests=""
            if [ -f "$failed_file" ]; then
              failed_tests="$(tr '\n' ' ' < "$failed_file")"
            fi
            log_tail=""
            if [ -f "$log_file" ]; then
              log_tail="$(tail -n 80 "$log_file" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            fi
            echo "::error file=.github/workflows/ci.yml,line=33,title=Release CTest failed::${failed_tests:-Release CTest failed without LastTestsFailed.log} ${log_tail}"
            if [ -f "$log_file" ]; then
              echo "::group::Release CTest LastTest.log"
              cat "$log_file"
              echo "::endgroup::"
            fi
            exit 1
          fi

      - name: Configure Python
        run: cmake --preset python

      - name: Build Python
        run: cmake --build --preset python --parallel 2

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/build/python
        run: python -m pytest tests/python -q

      - name: Release check without duplicated dev/python builds
        run: python tools/release_check.py --parallel 2 --skip-dev --skip-python --skip-consumer

  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux OpenCL ICD loader
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd clinfo clang-tidy

      - name: Configure
        run: >
          cmake -S . -B build
          -DMOTIFCL_BUILD_PYTHON=OFF
          -DMOTIFCL_BUILD_EXAMPLES=ON
          -DMOTIFCL_BUILD_TESTS=ON
          -DMOTIFCL_BUILD_TOOLS=ON
          -DMOTIFCL_BUILD_BENCHMARKS=OFF
          -DMOTIFCL_WARNINGS_AS_ERRORS=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --config Debug --parallel 2

      - name: Test
        if: runner.os == 'Linux'
        run: |
          if ! ctest --test-dir build -C Debug --output-on-failure --stop-on-failure; then
            failed_file="build/Testing/Temporary/LastTestsFailed.log"
            log_file="build/Testing/Temporary/LastTest.log"
            failed_tests=""
            if [ -f "$failed_file" ]; then
              failed_tests="$(tr '\n' ' ' < "$failed_file")"
            fi
            log_tail=""
            if [ -f "$log_file" ]; then
              log_tail="$(tail -n 80 "$log_file" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            fi
            echo "::error file=.github/workflows/ci.yml,line=70,title=CTest failed::${failed_tests:-CTest failed without LastTestsFailed.log} ${log_tail}"
            if [ -f "$log_file" ]; then
              echo "::group::CTest LastTest.log"
              cat "$log_file"
              echo "::endgroup::"
            fi
            exit 1
          fi

      - name: Clang-tidy diagnostics smoke
        if: runner.os == 'Linux'
        run: python tools/run_clang_tidy_smoke.py --build-dir build

      - name: Install and CMake consumer smoke
        if: runner.os == 'Linux'
        run: |
          cmake --install build --prefix build/install-smoke
          cmake -S tests/consumer -B build/consumer-smoke -DCMAKE_PREFIX_PATH="$PWD/build/install-smoke"
          cmake --build build/consumer-smoke --parallel 2
          ./build/consumer-smoke/motifcl_consumer_smoke

      - name: Perf regression tooling smoke
        if: runner.os == 'Linux'
        run: >
          python tools/perf_regression.py baselines/ellesmere.json baselines/ellesmere.json
          --tolerance 0.15
          --min-metrics 9
          --require-key matmul_q8_256_ms
          --require-key matmul_q4_256_ms
          --require-field metadata.device_family
          --require-baseline-field metadata.profile

      - name: Skip runtime tests on Windows hosted runners
        if: runner.os == 'Windows'
        run: echo "Build verified. Runtime OpenCL tests are skipped on hosted Windows runners because no GPU/ICD is guaranteed."

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCL ICD loader
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Wheel smoke
        run: |
          python -m pip install dist/*.whl pytest
          python - <<'PY'
          import motifcl as mcl
          b = mcl.Backend.create()
          mcl.manual_seed(123)
          x = mcl.ones(b, [2, 3])
          bias = mcl.tensor_f32(b, [3], [1, 2, 3])
          assert (x + bias).cpu() == [2, 3, 4, 2, 3, 4]
          import motifcl.nn as nn
          layer = nn.Sequential([nn.Linear(b, 3, 2), nn.GELU()])
          assert layer(x).shape == [2, 2]
          with mcl.no_grad():
            assert not mcl.is_grad_enabled()
          print("python smoke passed")
          PY
          pytest tests/python
          python -m compileall -q python/motifcl
          python tools/hf_integration_smoke.py

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux OpenCL ICD loader
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

      - name: Configure ASan/UBSan
        run: cmake --preset asan

      - name: Build ASan/UBSan
        run: cmake --build --preset asan --parallel 2

      - name: Test ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --preset asan --output-on-failure

  vulkan-off-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure OpenCL-off (Vulkan-only)
        run: >
          cmake -S . -B build/vulkan-off -G Ninja
          -DMOTIFCL_ENABLE_OPENCL=OFF
          -DMOTIFCL_BUILD_TESTS=ON
          -DMOTIFCL_BUILD_PYTHON=OFF
          -DMOTIFCL_BUILD_EXAMPLES=OFF
          -DMOTIFCL_BUILD_TOOLS=OFF

      - name: Build Vulkan-only witnesses
        run: >
          cmake --build build/vulkan-off --parallel 2
          --target test_vulkan_runtime_standalone test_vulkan_backend test_vulkan_train_step
          test_vulkan_reversible test_vulkan_memory_native

      - name: Assert the standalone witness links without OpenCL
        run: |
          if ninja -C build/vulkan-off -t commands test_vulkan_runtime_standalone | grep -i opencl; then
            echo "::error title=Vulkan witness contaminated::OpenCL appeared in the test_vulkan_runtime_standalone link line"
            exit 1
          fi

      - name: Run Vulkan-only tests (skip cleanly without a GPU)
        run: >
          ctest --test-dir build/vulkan-off --output-on-failure
          -R "test_vulkan_runtime_standalone|test_vulkan_backend|test_vulkan_train_step|test_vulkan_reversible|test_vulkan_memory_native"
